function draw(){const chosen=[...controls.querySelectorAll('input:checked')].map(x=>x.dataset.key);const W=chart.clientWidth||1100,H=chart.clientHeight||560;chart.setAttribute('viewBox','0 0 '+W+' '+H);chart.innerHTML='';if(!chosen.length)return;const pad={l:78,r:24,t:24,b:48};const vals=chosen.flatMap(k=>DATA.series[k].values);let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi){lo-=.01;hi+=.01}const ex=(hi-lo)*.08;lo-=ex;hi+=ex;const ds=chosen.flatMap(k=>DATA.series[k].dates).sort();const t0=Date.parse(ds[0]),t1=Date.parse(ds[ds.length-1]);const X=d=>pad.l+(Date.parse(d)-t0)/Math.max(1,t1-t0)*(W-pad.l-pad.r);const Y=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b);const ns='http://www.w3.org/2000/svg';const add=(tag,a)=>{const e=document.createElementNS(ns,tag);for(const k in a)e.setAttribute(k,a[k]);chart.appendChild(e);return e;};for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5;add('line',{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v),stroke:'#e5eaf2'});const tx=add('text',{x:pad.l-10,y:Y(v)+4,'text-anchor':'end',fill:'#667085','font-size':12});tx.textContent=pct(v);}add('line',{x1:pad.l,x2:W-pad.r,y1:Y(0),y2:Y(0),stroke:'#9ca3af','stroke-dasharray':'4 4'});for(let i=0;i<=5;i++){const d=new Date(t0+(t1-t0)*i/5);const tx=add('text',{x:X(d.toISOString().slice(0,10)),y:H-16,'text-anchor':'middle',fill:'#667085','font-size':12});tx.textContent=d.toISOString().slice(0,10);}chosen.forEach(k=>{const s=DATA.series[k];let d='';s.dates.forEach((dt,i)=>d+=(i?'L':'M')+X(dt).toFixed(2)+','+Y(s.values[i]).toFixed(2));add('path',{d,fill:'none',stroke:s.color,'stroke-width':k.includes('MARKET')?'2.6':'2.2','stroke-dasharray':s.dash==='dash'?'7 5':'none'});});chart.onmousemove=e=>{const rect=chart.getBoundingClientRect();const px=e.clientX-rect.left;const tt=t0+Math.max(0,Math.min(1,px/rect.width))*(t1-t0);let best=null;for(const k of chosen){const s=DATA.series[k];let bi=0,bd=Infinity;s.dates.forEach((dt,i)=>{const dd=Math.abs(Date.parse(dt)-tt);if(dd<bd){bd=dd;bi=i}});if(!best||bd<best.bd)best={k,bi,bd};}if(best){const s=DATA.series[best.k];tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.textContent=s.label+' · '+s.dates[best.bi]+' · '+pct(s.values[best.bi]);}};chart.onmouseleave=()=>tip.style.display='none';}
controls.addEventListener('change',draw);window.addEventListener('resize',draw);draw();
</script></body></html>
